[project]
name = "nba-aging-pipeline"
version = "0.1.0"
description = "Офлайн-пайплайн данных для дашборда «Игроки NBA: когда пора на пенсию?»"
requires-python = ">=3.11"
dependencies = [
    "kaggle>=2.2.1",
    "pandas>=3.0.3",
]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["pipeline"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
