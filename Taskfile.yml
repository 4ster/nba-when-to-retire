# Taskfile для проекта «Игроки NBA: когда пора на пенсию?»
# Двухфазный пайплайн: Python-агрегация (build-time) → один self-contained index.html.
# Запуск: task <цель>.  Список целей: task  (или task --list)
# Установка Task: https://taskfile.dev/installation/
version: '3'

silent: true

vars:
  PY: python                      # интерпретатор Python 3
  PIP: python -m pip
  RAW: data/sumitro               # каталог CSV датасета (task download кладёт сюда)
  DATASET: sumitrodatta           # адаптер датасета (pipeline/datasets.py)
  DATA: data/aging.json           # производный слим-JSON (контракт SPEC.md §2)
  HTML: index.html                # единственный артефакт рантайма
  BUDGET: 300000                  # бюджет размера слим-JSON, байт (RULES.md)
  # Метка данных в UI и диапазон сезонов выводятся из датасета (pipeline.build), не хардкод.

tasks:
  default:
    desc: Показать список доступных целей
    cmds:
      - task --list

  install:
    desc: Установить зависимости пайплайна (pandas, pytest и т.д.)
    cmds:
      - '{{.PIP}} install -r pipeline/requirements.txt'

  test:
    desc: Тесты пайплайна (pytest) — дельта-метод, per-36, survivorship, схема, бюджет
    cmds:
      - '{{.PY}} -m pytest pipeline/tests -q'

  download:
    desc: Скачать датасет sumitrodatta/nba-aba-baa-stats в {{.RAW}} (нужны kaggle CLI + токен)
    cmds:
      - '{{.PY}} -m kaggle datasets download -d sumitrodatta/nba-aba-baa-stats -p {{.RAW}} --unzip'

  data:
    desc: Прогнать пайплайн → собрать производный слим-JSON ({{.DATA}}); метка данных из датасета
    cmds:
      - '{{.PY}} -m pipeline.build --data {{.RAW}} --out {{.DATA}} --dataset {{.DATASET}}'
      - task: budget

  budget:
    desc: Проверить бюджет размера слим-JSON (< {{.BUDGET}} байт)
    cmds:
      - >
        node -e "const fs=require('fs');const n=fs.statSync('{{.DATA}}').size;
        if(n>{{.BUDGET}}){console.error('FAIL: '+n+' B > budget {{.BUDGET}} B');process.exit(1)}
        console.log('OK: slim-JSON '+n+' B (budget {{.BUDGET}} B)')"

  build:
    desc: Полная сборка — данные (TDD-гейт) → встраивание JSON в {{.HTML}} → валидация
    deps: [test]
    cmds:
      - task: data
      - '{{.PY}} -m pipeline.embed --data {{.DATA}} --html {{.HTML}}'
      - task: check

  check:
    desc: 'Валидация {{.HTML}}: один JS-блок (id="app"), синтаксис, без null-байтов'
    cmds:
      - node tools/check_html.mjs {{.HTML}}

  open:
    desc: Открыть готовый {{.HTML}} в браузере по умолчанию
    cmds:
      - cmd: cmd /c start "" {{.HTML}}
        platforms: [windows]
      - cmd: open {{.HTML}}
        platforms: [darwin]
      - cmd: xdg-open {{.HTML}}
        platforms: [linux]

  lint:
    desc: Линт Python-пайплайна (ruff, если установлен)
    cmds:
      - cmd: ruff check pipeline
        ignore_error: true

  clean:
    desc: Удалить производные артефакты пайплайна (data/, временные файлы)
    cmds:
      - rm -rf data .app.check.js

  ci:
    desc: Полный прогон для проверки — тесты, сборка, валидация
    cmds:
      - task: build
